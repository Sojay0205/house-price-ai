services:
  api:
    build: .
    image: houseprice-ai:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  demo:
    build: .
    image: houseprice-ai:latest
    command: >
      streamlit run app/streamlit_app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      HOUSEPRICE_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped
